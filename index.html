<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Привычки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#F3F1EA;
    --card:#FBFAF5;
    --card-alt:#E9E7DA;
    --olive:#8CA07D;
    --olive-deep:#6E7E60;
    --olive-soft:#E3E9DA;
    --bloom:#CFA08D;
    --lvl1:#D7DFC9;
    --lvl2:#B9C9A2;
    --lvl3:#9AB081;
    --text:#38352E;
    --text-muted:#948C7C;
    --divider:#E1DCC9;
    --shadow: 0 10px 28px rgba(56,53,46,0.08);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .serif{
    font-family:ui-serif, Georgia, "Times New Roman", serif;
  }

  .app{
    max-width:560px;
    margin:0 auto;
    padding: max(20px, env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom)) 18px;
  }

  /* ---------- Fallback banner ---------- */
  .banner{
    background:#F1E9D6;
    border:1px solid #E3D6B4;
    color:#7A6B3E;
    font-size:13px;
    line-height:1.5;
    padding:12px 14px;
    border-radius:14px;
    margin-bottom:16px;
  }

  /* ---------- Greeting card ---------- */
  .top-row{
    display:flex;
    gap:12px;
    margin-bottom:22px;
    align-items:stretch;
  }

  .photo-card{
    flex:0 0 38%;
    border-radius:24px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .photo-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .greeting{
    flex:1;
    background:var(--card);
    border-radius:24px;
    padding:22px 18px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .greeting .eyebrow{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--text-muted);
    margin:0 0 6px 0;
  }
  .greeting h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
    line-height:1.15;
  }
  .greeting .date{
    font-size:12px;
    color:var(--text-muted);
    margin:0;
  }
  .greeting .date::first-letter{
    text-transform:uppercase;
  }

  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .progress-count{
    font-size:15px;
    font-weight:600;
  }
  .progress-count span{
    color:var(--text-muted);
    font-weight:400;
  }
  .streak-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--olive-soft);
    color:var(--olive-deep);
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px 5px 8px;
    border-radius:999px;
  }
  .streak-pill svg{ width:13px; height:13px; }

  .progress-track{
    height:8px;
    background:var(--card-alt);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--olive);
    border-radius:999px;
    transition:width .5s ease;
  }

  /* ---------- Habit list ---------- */
  .list-label{
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:0.14em;
    color:var(--text-muted);
    margin:26px 4px 10px 4px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .list-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--divider);
  }

  .habit{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border-radius:18px;
    padding:15px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
    user-select:none;
    transition:transform .15s ease, opacity .3s ease;
  }
  .habit:active{ transform:scale(0.98); }

  .check{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid var(--card-alt);
    display:flex; align-items:center; justify-content:center;
    transition:background .25s ease, border-color .25s ease;
  }
  .check svg{
    width:14px; height:14px;
    opacity:0;
    transform:scale(.5);
    transition:opacity .2s ease, transform .2s ease;
  }
  .habit.done .check{
    background:var(--olive);
    border-color:var(--olive);
  }
  .habit.done .check svg{ opacity:1; transform:scale(1); }

  .habit-name{
    font-size:15.5px;
    transition:color .25s ease, opacity .25s ease;
  }
  .habit.done .habit-name{
    color:var(--text-muted);
    text-decoration:line-through;
    text-decoration-color:var(--text-muted);
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-muted);
    font-size:14px;
  }

  /* ---------- Calendar heatmap ---------- */
  .calendar-card{
    background:var(--card);
    border-radius:24px;
    padding:20px 18px;
    margin-top:24px;
    box-shadow:var(--shadow);
  }
  .calendar-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:16px;
  }
  .calendar-head h3{
    font-size:15.5px;
    margin:0;
    font-weight:600;
  }
  .calendar-head span{
    font-size:12px;
    color:var(--text-muted);
  }
  .weekdays, .days-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .weekdays{ margin-bottom:8px; }
  .weekdays div{
    text-align:center;
    font-size:10px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .day-cell{
    aspect-ratio:1;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11.5px;
    color:var(--text);
    background:var(--card-alt);
  }
  .day-cell.empty{ background:transparent; }
  .day-cell.lvl-none{
    background:transparent;
    border:1px solid var(--divider);
    color:var(--text-muted);
  }
  .day-cell.lvl-1{ background:var(--lvl1); }
  .day-cell.lvl-2{ background:var(--lvl2); }
  .day-cell.lvl-3{ background:var(--lvl3); color:#fff; }
  .day-cell.lvl-4{ background:var(--olive-deep); color:var(--card); font-weight:600; }
  .day-cell.today{ box-shadow:0 0 0 2px var(--olive-deep) inset; font-weight:700; }


  /* ---------- FAB ---------- */
  .fab-fade{
    position:fixed;
    left:0; right:0; bottom:0;
    height:120px;
    background:linear-gradient(to bottom, rgba(243,241,234,0) 0%, var(--bg) 65%);
    pointer-events:none;
    z-index:5;
  }
  .fab{
    position:fixed;
    left:18px; right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom));
    max-width:524px;
    margin:0 auto;
    display:block;
    width:calc(100% - 36px);
    background:var(--olive-deep);
    color:var(--card);
    border:none;
    border-radius:999px;
    padding:16px;
    font-size:15.5px;
    font-weight:600;
    box-shadow:0 12px 24px rgba(87,96,63,0.28);
    z-index:6;
  }

  /* ---------- Sheet ---------- */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(58,54,46,0.35);
    opacity:0;
    transition:opacity .25s ease;
    z-index:10;
  }
  .backdrop.show{ opacity:1; }

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--card);
    border-radius:26px 26px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom)) 20px;
    box-shadow:0 -12px 30px rgba(58,54,46,0.18);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    z-index:11;
  }
  .sheet.show{ transform:translateY(0); }

  .sheet-handle{
    width:36px; height:4px;
    background:var(--card-alt);
    border-radius:999px;
    margin:0 auto 18px auto;
  }
  .sheet h2{
    font-size:17px;
    margin:0 0 14px 0;
  }
  .sheet input{
    width:100%;
    font-size:15.5px;
    padding:14px 16px;
    border-radius:14px;
    border:1.5px solid var(--divider);
    background:var(--bg);
    color:var(--text);
    outline:none;
    margin-bottom:16px;
  }
  .sheet input:focus{ border-color:var(--olive); }

  .sheet-actions{ display:flex; gap:10px; }
  .sheet-actions button{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:none;
    font-size:15px;
    font-weight:600;
  }
  #cancel-btn{ background:var(--card-alt); color:var(--text); }
  #save-btn{ background:var(--olive-deep); color:var(--card); }
  #save-btn:disabled{ opacity:.45; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>

        </div>

  <main id="habit-list"></main>

  <div class="calendar-card">
    <div class="calendar-head">
      <h3 class="serif" id="calendar-month">—</h3>
      <span>по дням выполнения</span>
    </div>
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-handle"></div>
  <h2 class="serif">Новая привычка</h2>
  <input id="habit-input" type="text" placeholder="Например: Прогулка вечером" maxlength="60">
  <div class="sheet-actions">
    <button id="cancel-btn">Отмена</button>
    <button id="save-btn" disabled>Добавить</button>
  </div>
</div>

<script>
(function(){
  try{
    if(window.Telegram && window.Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      if(Telegram.WebApp.setBackgroundColor) Telegram.WebApp.setBackgroundColor('#F3EFE6');
      if(Telegram.WebApp.setHeaderColor) Telegram.WebApp.setHeaderColor('#F3EFE6');
    }
  }catch(e){}

  var FALLBACK = {
    user: { name: "Ксюша" },
    streak: 4,
    habits: [
      { id:1, name:"Читать «Божественную комедию» Данте", done:false },
      { id:2, name:"Автошкола",                             done:true },
      { id:3, name:"Обучение SMM",                          done:true },
      { id:4, name:"Обучение Claude",                       done:false },
      { id:5, name:"Шахматы",                               done:false },
      { id:6, name:"Фитнес",                                done:true },
      { id:7, name:"Сказать доченькам слова благодарности", done:false }
    ],
    history: [
      {"date":"2026-08-01","done":4},{"date":"2026-08-02","done":6},{"date":"2026-08-03","done":7},
      {"date":"2026-08-04","done":5},{"date":"2026-08-05","done":2},{"date":"2026-08-06","done":0},
      {"date":"2026-08-07","done":3},{"date":"2026-08-08","done":6},{"date":"2026-08-09","done":7},
      {"date":"2026-08-10","done":1},{"date":"2026-08-11","done":0},{"date":"2026-08-12","done":0},
      {"date":"2026-08-13","done":2},{"date":"2026-08-14","done":4},{"date":"2026-08-15","done":6},
      {"date":"2026-08-16","done":6},{"date":"2026-08-17","done":7},{"date":"2026-08-18","done":7},
      {"date":"2026-08-19","done":7},{"date":"2026-08-20","done":7}
    ]
  };

  var state = null;
  var nextId = 1000;
  var MONTHS_RU = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

  function hourGreeting(){
    var h = new Date().getHours();
    if(h < 5) return "Доброй ночи";
    if(h < 12) return "Доброе утро";
    if(h < 18) return "Добрый день";
    return "Добрый вечер";
  }

  function formatDate(){
    try{
      var d = new Intl.DateTimeFormat('ru-RU',{day:'numeric', month:'long', weekday:'long'}).format(new Date());
      return d;
    }catch(e){ return ""; }
  }

  // ---------- Growing flower (streak visual) ----------
  function growthStage(streak){
    if(streak >= 14) return 4;
    if(streak >= 7) return 3;
    if(streak >= 3) return 2;
    if(streak >= 1) return 1;
    return 0;
  }

  var GROWTH_SVG = [
    '<circle cx="12" cy="19" r="2.6" fill="currentColor"/>',
    '<path d="M12 21V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 16c0-2.5 2.3-3.3 4-3.3-.8 2.4-1.6 4-4 3.3z" fill="currentColor"/>',
    '<path d="M12 21V9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 13c0-3 3-4 5-4-1 3-2 5-5 4z" fill="currentColor"/><path d="M12 16c0-3-3-4-5-4 1 3 2 5 5 4z" fill="currentColor"/>',
    '<path d="M12 21V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 14c0-3 3-4 5-4-1 3-2 5-5 4z" fill="currentColor"/><path d="M12 17c0-3-3-4-5-4 1 3 2 5 5 4z" fill="currentColor"/><ellipse cx="12" cy="6" rx="2.6" ry="3.6" fill="currentColor"/>',
    '<path d="M12 21V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 15c0-3 3-4 5-4-1 3-2 5-5 4z" fill="currentColor"/><path d="M12 18c0-3-3-4-5-4 1 3 2 5 5 4z" fill="currentColor"/><g fill="var(--bloom)"><circle cx="12" cy="5" r="2"/><circle cx="9.2" cy="7" r="2"/><circle cx="14.8" cy="7" r="2"/><circle cx="12" cy="8.6" r="2"/></g><circle cx="12" cy="7" r="1.2" fill="currentColor"/>'
  ];

  function renderGrowthIcon(streak){
    document.getElementById('streak-icon').innerHTML = GROWTH_SVG[growthStage(streak)];
  }

  // ---------- Calendar heatmap ----------
  function levelClass(done, total){
    if(!total) return 'lvl-1';
    var rate = done/total;
    if(rate <= 0) return 'lvl-none-zero';
    if(rate < 0.3) return 'lvl-1';
    if(rate < 0.6) return 'lvl-2';
    if(rate < 1) return 'lvl-3';
    return 'lvl-4';
  }

  function buildCalendar(history, totalHabits){
    var byDate = {};
    (history || []).forEach(function(h){ byDate[h.date] = h.done; });

    var today = new Date();
    var year = today.getFullYear(), month = today.getMonth();
    document.getElementById('calendar-month').textContent = MONTHS_RU[month] + ' ' + year;

    var firstDay = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var offset = (firstDay.getDay() + 6) % 7; // Monday-first offset

    var grid = document.getElementById('days-grid');
    grid.innerHTML = '';

    for(var i = 0; i < offset; i++){
      var blank = document.createElement('div');
      blank.className = 'day-cell empty';
      grid.appendChild(blank);
    }

    var todayStr = today.toISOString().slice(0,10);

    for(var day = 1; day <= daysInMonth; day++){
      var mm = String(month+1).padStart(2,'0');
      var dd = String(day).padStart(2,'0');
      var dateStr = year + '-' + mm + '-' + dd;

      var cell = document.createElement('div');
      var cls = 'day-cell';
      if(byDate.hasOwnProperty(dateStr)){
        var lvl = levelClass(byDate[dateStr], totalHabits);
        cls += ' ' + (lvl === 'lvl-none-zero' ? 'lvl-none' : lvl);
      } else {
        cls += ' lvl-none';
      }
      if(dateStr === todayStr) cls += ' today';
      cell.className = cls;
      cell.textContent = day;
      grid.appendChild(cell);
    }
  }

  function render(){
    document.getElementById('greeting-eyebrow').textContent = hourGreeting() + ',';
    document.getElementById('greeting-name').textContent = state.user.name;
    document.getElementById('greeting-date').textContent = formatDate();

    var total = state.habits.length;
    var done = state.habits.filter(function(h){ return h.done; }).length;
    document.getElementById('progress-count').innerHTML = done + ' <span>из ' + total + '</span>';
    document.getElementById('progress-fill').style.width = (total ? Math.round(done/total*100) : 0) + '%';
    document.getElementById('streak-text').textContent = state.streak + (streakWord(state.streak));
    renderGrowthIcon(state.streak);

    if(state.history){
      var todayStr = new Date().toISOString().slice(0,10);
      var todayEntry = state.history.filter(function(h){ return h.date === todayStr; })[0];
      if(todayEntry){ todayEntry.done = done; }
      else { state.history.push({ date: todayStr, done: done }); }
      buildCalendar(state.history, total);
    }

    var list = document.getElementById('habit-list');
    list.innerHTML = '';

    if(total === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Пока нет привычек — добавь первую кнопкой ниже';
      list.appendChild(empty);
      return;
    }

    var label = document.createElement('div');
    label.className = 'list-label';
    label.textContent = 'Мои привычки';
    list.appendChild(label);

    state.habits.forEach(function(h){
      var row = document.createElement('div');
      row.className = 'habit' + (h.done ? ' done' : '');
      row.innerHTML =
        '<div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="' + getComputedStyle(document.documentElement).getPropertyValue('--card') + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<div class="habit-name">' + escapeHtml(h.name) + '</div>';
      row.addEventListener('click', function(){
        h.done = !h.done;
        render();
      });
      list.appendChild(row);
    });
  }

  function streakWord(n){
    var mod10 = n % 10, mod100 = n % 100;
    if(mod10 === 1 && mod100 !== 11) return ' день подряд';
    if([2,3,4].indexOf(mod10) > -1 && [12,13,14].indexOf(mod100) === -1) return ' дня подряд';
    return ' дней подряд';
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function loadData(){
    fetch('data.json?v=' + Date.now())
      .then(function(res){ if(!res.ok) throw new Error('bad status'); return res.json(); })
      .then(function(json){
        state = json;
        document.getElementById('banner').hidden = true;
        render();
      })
      .catch(function(){
        state = FALLBACK;
        document.getElementById('banner').hidden = false;
        render();
      });
  }

  // ---------- Add habit sheet ----------
  var backdrop = document.getElementById('backdrop');
  var sheet = document.getElementById('sheet');
  var input = document.getElementById('habit-input');
  var saveBtn = document.getElementById('save-btn');

  function openSheet(){
    backdrop.hidden = false; sheet.hidden = false;
    requestAnimationFrame(function(){
      backdrop.classList.add('show');
      sheet.classList.add('show');
    });
    input.value = '';
    saveBtn.disabled = true;
    setTimeout(function(){ input.focus(); }, 250);
  }
  function closeSheet(){
    backdrop.classList.remove('show');
    sheet.classList.remove('show');
    setTimeout(function(){ backdrop.hidden = true; sheet.hidden = true; }, 300);
  }

  document.getElementById('add-btn').addEventListener('click', openSheet);
  document.getElementById('cancel-btn').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  input.addEventListener('input', function(){
    saveBtn.disabled = input.value.trim().length === 0;
  });
  saveBtn.addEventListener('click', function(){
    var name = input.value.trim();
    if(!name) return;
    state.habits.push({ id: nextId++, name: name, done:false });
    closeSheet();
    render();
  });

  loadData();
})();
</script>
</body>
</html>
